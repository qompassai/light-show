name: Android Test Compile

# Fast per-push signal that android/app/src/androidTest still compiles
# against the current Gradle scaffold. Deliberately does NOT need the NDK,
# cargo-ndk, or an emulator, so it runs on every push/PR in well under a
# minute. See the `instrumented-tests` job in android.yml for the full
# on-device run (NDK build + emulator), which only fires on tags/
# workflow_dispatch since it is much slower.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile instrumentation tests
        working-directory: android
        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon
