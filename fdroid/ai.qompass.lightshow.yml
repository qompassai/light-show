IssueTracker: https://github.com/qompassai/light-show/issues

RepoType: git
Repo: https://github.com/qompassai/light-show.git

Builds:
  - versionName: '0.1.0'
    versionCode: 16777472
    # Channel split (2026-10-07): the main tree carries keyed answer
    # tags and release builds inject the key; F-Droid cannot hold the
    # key, so this recipe stays pinned to the last plaintext commit.
    # Do NOT bump past the tag migration without revisiting the split
    # -- a keyless build of tagged data fails closed (quiz/API/triage
    # levels unpassable by design). See docs/FDROID.md.
    commit: 4e1711da1a3eb87f84f708f39a8319a5f28f90f9
    ndk: 30.0.16248370
    subdir: game
    sudo:
      - apt-get update
      - apt-get install -y curl build-essential
    init:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - . $HOME/.cargo/env
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - cargo install cargo-apk --version 0.10.0
    build:
      - keytool -genkeypair -keystore /tmp/fdroid-ephemeral.jks -alias fdroid -keyalg RSA -keysize 2048 -validity 10950 -storepass fdroid -keypass fdroid -dname "CN=F-Droid Ephemeral"
      - export CARGO_APK_RELEASE_KEYSTORE=/tmp/fdroid-ephemeral.jks
      - export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=<redacted>
      - cargo apk build --release --lib
    output: target/release/apk/light_show.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '0.1.0'
CurrentVersionCode: 16777472
