<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse flow — deterministic port of pulse.wgsl</title>
<style>
  html, body { margin: 0; padding: 0; background: #03050d; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="scene" width="640" height="360"></canvas>
<script>
'use strict';
/*
 * DETERMINISTIC PORT — fiber pulse flow.
 * Source of the motion: game/assets/shaders/pulse.wgsl, driven by
 * board.rs `sync_fiber_flows` (FiberFlow quads on every placed edge)
 * with PulseSettings from game/src/shaders.rs defaults + board.rs:
 *   color (1.0, 0.85, 0.55), speed 0.8 cycles/s, width 0.08,
 *   base_brightness 0.25. Shader math, verbatim:
 *     head = fract(time * speed)
 *     d = wrapped |uv.x - head|; pulse = exp(-d*d / (width*width))
 *     brightness = base_brightness + pulse
 *     alpha = clamp(sin(uv.y * pi) * brightness)
 * In the game the uniform `time` accumulates wall-clock dt
 * (shaders.rs `tick_shader_time`); here time is the seek parameter t,
 * which is the entire point of the port: same function, seekable clock.
 * The quad's on-canvas height (48 px band) is presentational — the
 * shader is uv-space and resolution-independent.
 * Contract: renderFrame(t) is a pure function of t. No wall clock, no
 * accumulated state, no unseeded randomness anywhere in the draw path.
 */
window.DURATION = 5;    // 4 full pulse periods at 0.8 cycles/s
window.FPS = 240;

const W = 640, H = 360;
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

/* Game constants (see header). */
const SPEED = 0.8, WIDTH = 0.08, BASE = 0.25;
const COLOR = [1.0, 0.85, 0.55];
const QUAD_X0 = 40, QUAD_X1 = 600, BAND_Y = 156, BAND_H = 48;

/* Atmosphere backdrop colors from AtmosphereSettings::default(). */
const BG_TOP = [8, 13, 26], BG_BOT = [3, 5, 13];
function bgAt(y) {
  const f = y / (H - 1);
  return [BG_TOP[0] + (BG_BOT[0] - BG_TOP[0]) * f,
          BG_TOP[1] + (BG_BOT[1] - BG_TOP[1]) * f,
          BG_TOP[2] + (BG_BOT[2] - BG_TOP[2]) * f];
}

const band = ctx.createImageData(W, BAND_H);
function drawBand(t) {
  const head = (t * SPEED) % 1;
  const data = band.data;
  /* Per-column pulse brightness (the gaussian depends only on u). */
  const colB = new Float32Array(W);
  for (let x = QUAD_X0; x < QUAD_X1; x++) {
    const u = (x - QUAD_X0) / (QUAD_X1 - QUAD_X0);
    let d = Math.abs(u - head);
    d = Math.min(d, 1.0 - d);
    colB[x] = BASE + Math.exp(-(d * d) / (WIDTH * WIDTH));
  }
  for (let y = 0; y < BAND_H; y++) {
    const v = y / (BAND_H - 1);
    const fall = Math.sin(Math.PI * v);
    const bg = bgAt(BAND_Y + y);
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (x < QUAD_X0 || x >= QUAD_X1) {
        data[i] = bg[0]; data[i + 1] = bg[1]; data[i + 2] = bg[2]; data[i + 3] = 255;
        continue;
      }
      const b = colB[x];
      const a = Math.min(1, Math.max(0, fall * b));
      /* WGSL returns color.rgb * brightness * v with that alpha, Blend mode. */
      data[i]     = Math.min(255, (COLOR[0] * b * fall) * a * 255 + bg[0] * (1 - a));
      data[i + 1] = Math.min(255, (COLOR[1] * b * fall) * a * 255 + bg[1] * (1 - a));
      data[i + 2] = Math.min(255, (COLOR[2] * b * fall) * a * 255 + bg[2] * (1 - a));
      data[i + 3] = 255;
    }
  }
  ctx.putImageData(band, 0, BAND_Y);
}

window.renderFrame = function (t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgb(8,13,26)'); g.addColorStop(1, 'rgb(3,5,13)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawBand(t);
  /* Fiber end nodes (static anchors, as on the board). */
  for (const x of [QUAD_X0, QUAD_X1]) {
    ctx.strokeStyle = 'rgba(111,242,255,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, 180, 13, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(111,242,255,0.25)';
    ctx.beginPath(); ctx.arc(x, 180, 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(111,242,255,0.9)';
  ctx.font = '600 15px "DejaVu Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('FIBER PULSE FLOW — pulse.wgsl @ 0.8 cycles/s', W / 2, 60);
  ctx.fillStyle = 'rgba(56,189,248,0.55)';
  ctx.fillRect(0, H - 4, W * (t / window.DURATION), 4);
};

/* Human preview only — the renderer replaces requestAnimationFrame before load. */
requestAnimationFrame(function loop(ts) {
  window.renderFrame((ts / 1000) % window.DURATION);
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
