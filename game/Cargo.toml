[package]
name = "light-show"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Light Show — OSP fiber-optic puzzle game with anime companions, built in Bevy"

[lib]
name = "light_show"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "light-show"
path = "src/main.rs"

[dependencies]
osp_sim = { path = "../crates/osp_sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_ecs = "0.14"
bevy_state = "0.14"

[target.'cfg(not(target_os = "android"))'.dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_state",
    "bevy_gizmos",
    "bevy_audio",
    "vorbis",
    "png",
    "x11",
    "multi_threaded",
] }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_state",
    "bevy_gizmos",
    "bevy_audio",
    "vorbis",
    "png",
    "android_shared_stdcxx",
    "multi_threaded",
] }

[package.metadata.android]
package = "ai.qompass.lightshow"
apk_label = "Light Show"
target_sdk_version = 34
min_sdk_version = 26
fullscreen = true
opengles_version = [3, 0]

[package.metadata.android.application]
label = "Light Show"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false
