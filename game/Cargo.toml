[package]
name = "light-show"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Light Show — OSP fiber-optic puzzle game with anime companions, built in Bevy"

[lib]
name = "light_show"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "light-show"
path = "src/main.rs"

[dependencies]
osp_sim = { path = "../crates/osp_sim", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_ecs = "0.14"
bevy_state = "0.14"
# Only pulled in by the `instrumented-test-logging` feature (see below) —
# retail Play Store / F-Droid builds never depend on this.
log = { version = "0.4", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_state",
    "bevy_gizmos",
    "bevy_audio",
    "vorbis",
    "mp3",
    "png",
    "x11",
    "multi_threaded",
] }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_state",
    "bevy_gizmos",
    "bevy_audio",
    "vorbis",
    "mp3",
    "png",
    "android_shared_stdcxx",
    "multi_threaded",
] }

# Only pulled in by the `instrumented-test-logging` feature. Emits the
# board's connect/select/level-ready events to Logcat so the on-device
# instrumentation tests in android/app/src/androidTest can assert against
# them — a NativeActivity has no Espresso-visible view hierarchy, so this
# is the black-box signal those tests read. See game/src/board.rs's
# `test_log!` macro and docs/BUILD.md.
android_logger = { version = "0.14", optional = true }

[features]
# Off by default: retail builds (cargo-apk for F-Droid, the Gradle release
# build type for Play Store) never enable this. Only the Gradle *debug*
# build type's jniLibs should be built with
# `cargo ndk ... build --features instrumented-test-logging`, specifically
# for running android/app/src/androidTest against.
instrumented-test-logging = ["dep:log", "dep:android_logger"]

[package.metadata.android]
package = "ai.qompass.lightshow"
assets = "assets"
build_targets = [ "aarch64-linux-android", "x86_64-linux-android" ]
apk_label = "Light Show"
fullscreen = true
opengles_version = [3, 0]

# NOTE: cargo-apk only honors SDK versions in this NESTED table.
# Flat `target_sdk_version` / `min_sdk_version` keys directly under
# [package.metadata.android] are silently ignored (manifest falls back
# to cargo-apk's defaults: min 23, target 30). Verified 2026-09-30
# against the cargo-apk README + a built manifest showing the defaults.
[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

[package.metadata.android.application]
label = "Light Show"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false
