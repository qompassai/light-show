[package]
name = "light-show-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Integration tests validating the whole light-show repo: physics, game logic, assets, structure."

# Test files live directly in tests/ (Matt's "test dir"), wired explicitly
# so the layout stays flat and obvious.

[[test]]
name = "physics_link_budget"
path = "physics_link_budget.rs"

[[test]]
name = "physics_adversarial"
path = "physics_adversarial.rs"

[[test]]
name = "game_levels"
path = "game_levels.rs"

[[test]]
name = "game_cheats_dialogue"
path = "game_cheats_dialogue.rs"

[[test]]
name = "game_audio"
path = "game_audio.rs"

[[test]]
name = "assets_images"
path = "assets_images.rs"

[[test]]
name = "structural"
path = "structural.rs"

[[test]]
name = "answer_gates"
path = "answer_gates.rs"

[[test]]
name = "game_quiz"
path = "game_quiz.rs"

[[test]]
name = "edge_cases"
path = "edge_cases.rs"

[[test]]
name = "stress_tests"
path = "stress_tests.rs"

[[test]]
name = "bevy_issues"
path = "bevy_issues.rs"

[[test]]
name = "shader_render"
path = "shader_render.rs"

[[test]]
name = "android_windows"
path = "android_windows.rs"

[[test]]
name = "security"
path = "security.rs"

[[test]]
name = "save_files"
path = "save_files.rs"

[dependencies]
osp_sim = { path = "../crates/osp_sim" }
light-show = { path = "../game" }
image = "0.25"
serde_json = "1"
rodio = { version = "0.22", default-features = false }
